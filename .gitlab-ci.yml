stages:
  - test
  - image

cpu-smoke-test:
  stage: test
  image: debian:12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc gfortran make libc6-dev
  script:
    - make test
  artifacts:
    when: always
    paths:
      - results/demo.csv

# Requires a GitLab Runner configured for Docker-in-Docker (privileged).
# Adapt to AIP's runner policy or use BuildKit/Kaniko if privileged is unavailable.
build-container:
  stage: image
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/grapesph-grape3-cpu:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/grapesph-grape3-cpu:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

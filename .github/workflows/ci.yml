name: GRAPE-3 CPU validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-demo:
    name: Fortran/C compatibility and force-neighbour checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc gfortran make
      - name: Build and validate
        run: make clean && make test
      - name: Keep validation output
        uses: actions/upload-artifact@v4
        with:
          name: grape3-cpu-demo
          path: results/demo.csv
          if-no-files-found: error
